<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" role="img" aria-label="Meat Mall delivery rider">
  <!--
    Meat Mall delivery rider (order tracker mascot): the steak character from the logo,
    in a white helmet, riding a red scooter with a Meat Mall delivery box.
    Palette: ink #141414, brand #e4002b, brand-deep #8f0016, white, rim #e5e5e5, light #ffd34d.
    Animated groups (class names used by the site and design/motion/order-tracker.html):
      mm-speed  speed lines        mm-puff   exhaust puffs
      mm-bob    body + rider + box mm-wheel  each wheel (spins around its own centre)
    Site copy: client/src/components/order-tracker.tsx (DeliveryRider)
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground shadow -->
    <ellipse cx="78" cy="94" rx="46" ry="3.5" fill="#141414" opacity="0.1" />

    <!-- Speed lines -->
    <g class="mm-speed" stroke="#141414" stroke-opacity="0.35" stroke-width="3">
      <path d="M2 46 H20" />
      <path d="M8 58 H24" />
      <path d="M0 70 H18" />
    </g>

    <!-- Exhaust puffs -->
    <g class="mm-puff" fill="#d4d4d4">
      <circle cx="22" cy="82" r="4" />
      <circle cx="14" cy="78" r="3" />
    </g>

    <!-- Wheels -->
    <g class="mm-wheel">
      <circle cx="40" cy="80" r="12" fill="#141414" />
      <circle cx="40" cy="80" r="7" fill="#e5e5e5" />
      <path d="M40 73 V87 M33.9 76.5 L46.1 83.5 M33.9 83.5 L46.1 76.5" stroke="#141414" stroke-width="1.6" />
      <circle cx="40" cy="80" r="2.2" fill="#141414" />
    </g>
    <g class="mm-wheel">
      <circle cx="112" cy="80" r="12" fill="#141414" />
      <circle cx="112" cy="80" r="7" fill="#e5e5e5" />
      <path d="M112 73 V87 M105.9 76.5 L118.1 83.5 M105.9 83.5 L118.1 76.5" stroke="#141414" stroke-width="1.6" />
      <circle cx="112" cy="80" r="2.2" fill="#141414" />
    </g>

    <g class="mm-bob">
      <!-- Delivery box -->
      <rect x="22" y="28" width="36" height="30" rx="5" fill="#ffffff" stroke="#141414" stroke-width="3" />
      <rect x="23.5" y="39" width="33" height="8" fill="#e4002b" />
      <ellipse cx="40" cy="43" rx="5.5" ry="2.8" fill="#ffffff" stroke="#141414" stroke-width="1.5" />
      <path d="M22 35 H58" stroke="#141414" stroke-width="2" />

      <!-- Scooter: rear body, seat, floor, front column, leg shield, fender -->
      <path d="M24 74 C24 62 34 58 46 58 L66 58 C72 58 74 64 72 70 L70 76 L28 76 C25 76 24 75 24 74 Z" fill="#e4002b" stroke="#141414" stroke-width="3" />
      <rect x="46" y="53" width="24" height="6" rx="3" fill="#141414" />
      <path d="M68 74 H94" stroke="#141414" stroke-width="6" />
      <path d="M93 76 L103 38" stroke="#141414" stroke-width="6" />
      <path d="M90 76 L98 46 C99 41 105 41 105 46 L103 60 C102 70 98 76 90 76 Z" fill="#e4002b" stroke="#141414" stroke-width="3" />
      <path d="M100 78 C100 65 124 65 124 78" fill="#e4002b" stroke="#141414" stroke-width="3" />
      <circle cx="108" cy="48" r="4.5" fill="#ffd34d" stroke="#141414" stroke-width="2.5" />
      <path d="M96 36 L112 34" stroke="#141414" stroke-width="5" />

      <!-- Rider: steak character -->
      <path d="M52 44 C50 28 64 18 78 22 C90 25 92 38 86 48 C80 58 56 58 52 44 Z" fill="#e4002b" stroke="#141414" stroke-width="3" />
      <path d="M58 46 C64 42 70 46 76 42" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2.5" />
      <path d="M84 41 Q91 37 99 36" fill="none" stroke="#141414" stroke-width="4" />
      <circle cx="71" cy="34" r="2.3" fill="#141414" />
      <circle cx="80" cy="33" r="2.3" fill="#141414" />
      <circle cx="71.7" cy="33.2" r="0.8" fill="#ffffff" />
      <circle cx="80.7" cy="32.2" r="0.8" fill="#ffffff" />
      <path d="M72 40 Q76 43.5 80 39.5" fill="none" stroke="#141414" stroke-width="2" />
      <ellipse cx="68.5" cy="39" rx="2.2" ry="1.3" fill="#ff8fa0" />

      <!-- Helmet -->
      <path d="M60 29 C59 14 86 9 91 26 C84 24 70 25 60 29 Z" fill="#ffffff" stroke="#141414" stroke-width="3" />
      <path d="M74.5 17 C75.8 20 76 22.5 75.6 25" fill="none" stroke="#e4002b" stroke-width="3.5" />
    </g>
  </g>
</svg>
